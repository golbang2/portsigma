services:
  - type: web
    name: portsigma-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGINS
        sync: false
      # Gurobi WLS (Web License Service) — set these in Render dashboard for Gurobi solver.
      # Without them, optimizer automatically falls back to scipy (SLSQP).
      # Obtain from https://license.gurobi.com
      - key: GRB_WLSACCESSID
        sync: false
      - key: GRB_WLSSECRET
        sync: false
      - key: GRB_LICENSEID
        sync: false
